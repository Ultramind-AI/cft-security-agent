name: CFT Security Pipeline

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: Allowed target repository (owner/name)
        required: true
        default: Ultramind-AI/sberlab_hack
        type: string
      target_ref:
        description: Target branch, tag or commit
        required: true
        default: main
        type: string
      target_profile:
        description: Trusted profile path in the agent repository
        required: true
        default: targets/sberlab.yaml
        type: string
      agent_mode:
        description: Agent model mode
        required: true
        default: stub
        type: choice
        options:
          - stub
          - llm
      agent_ref:
        description: Security agent branch, tag or commit
        required: true
        default: main
        type: string
  workflow_call:
    inputs:
      target_repository:
        required: true
        type: string
      target_ref:
        required: true
        type: string
      target_profile:
        required: true
        type: string
      agent_mode:
        required: false
        default: stub
        type: string
      agent_ref:
        required: false
        default: main
        type: string
    secrets:
      AGENT_REPOSITORY_TOKEN:
        required: false
      TARGET_REPOSITORY_TOKEN:
        required: false
      GROQ_API_KEY:
        required: false
      MISTRAL_API_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false
      NVIDIA_NIM_API_KEY:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions:
  contents: read

jobs:
  quality:
    name: Unit tests and Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout security agent
        uses: actions/checkout@v4
        with:
          repository: Ultramind-AI/cft-security-agent
          ref: ${{ inputs.agent_ref }}
          persist-credentials: false
          token: ${{ secrets.AGENT_REPOSITORY_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run test suite
        env:
          CFT_AGENT_MODE: stub
        run: python -m pytest -q -ra

  security-boundary-integration:
    name: Security boundary integration
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout security agent
        uses: actions/checkout@v4
        with:
          repository: Ultramind-AI/cft-security-agent
          ref: ${{ inputs.agent_ref }}
          path: agent
          persist-credentials: false
          token: ${{ secrets.AGENT_REPOSITORY_TOKEN || github.token }}

      - name: Checkout SberLab target
        uses: actions/checkout@v4
        with:
          repository: Ultramind-AI/sberlab_hack
          ref: main
          path: sberlab-target
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.TARGET_REPOSITORY_TOKEN || github.token }}

      - name: Checkout AutoDealer target
        uses: actions/checkout@v4
        with:
          repository: stavrmoris/autodealer
          ref: main
          path: autodealer-target
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.TARGET_REPOSITORY_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/pyproject.toml

      - name: Install test dependencies
        working-directory: agent
        run: python -m pip install -e ".[dev]"

      - name: Prepare immutable sandbox image
        shell: bash
        run: |
          docker pull python:3.12-alpine
          image_digest="$(docker image inspect python:3.12-alpine --format '{{index .RepoDigests 0}}')"
          test -n "$image_digest"
          echo "CFT_SANDBOX_IMAGE=$image_digest" >> "$GITHUB_ENV"

      - name: Run trusted target boundary tests
        working-directory: agent
        env:
          CFT_AGENT_MODE: stub
          SBERLAB_TARGET_PATH: ../sberlab-target
          AUTODEALER_TARGET_PATH: ../autodealer-target
        run: >
          python -m pytest -q -ra -m integration
          tests/test_docker_sandbox_boundary.py
          tests/test_sandbox_manager_integration.py

  security-gate:
    name: Security gate
    needs: [quality, security-boundary-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout security agent
        uses: actions/checkout@v4
        with:
          repository: Ultramind-AI/cft-security-agent
          ref: ${{ inputs.agent_ref }}
          path: agent
          persist-credentials: false
          token: ${{ secrets.AGENT_REPOSITORY_TOKEN || github.token }}

      - name: Checkout complete allowed target
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_ref }}
          path: target
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.TARGET_REPOSITORY_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/pyproject.toml

      - name: Install pipeline dependencies
        working-directory: agent
        run: python -m pip install -e ".[sast]"

      - name: Prepare immutable sandbox image
        shell: bash
        run: |
          docker pull python:3.12-alpine
          image_digest="$(docker image inspect python:3.12-alpine --format '{{index .RepoDigests 0}}')"
          test -n "$image_digest"
          echo "CFT_SANDBOX_IMAGE=$image_digest" >> "$GITHUB_ENV"

      - name: Run discovery, sandbox, SAST and gate
        working-directory: agent
        env:
          CFT_AGENT_MODE: ${{ inputs.agent_mode }}
          TARGET_REPOSITORY_INPUT: ${{ inputs.target_repository }}
          TARGET_PROFILE_INPUT: ${{ inputs.target_profile }}
          AGENT_MODE_INPUT: ${{ inputs.agent_mode }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python -m app.ci_pipeline \
            --target ../target \
            --target-repository "$TARGET_REPOSITORY_INPUT" \
            --profile "$TARGET_PROFILE_INPUT" \
            --agent-mode "$AGENT_MODE_INPUT" \
            --output-dir artifacts/security-pipeline \
            --max-iterations 1

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cft-security-results-${{ github.run_id }}
          path: agent/artifacts/security-pipeline
          if-no-files-found: error
          retention-days: 14
