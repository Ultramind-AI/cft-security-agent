<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Архитектура CFT Security Agent</title>
  <desc id="desc">Путь от pull request и SAST до контролируемой проверки, Evidence, FinalReport и CI Gate</desc>

  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#202426" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#7f8a91"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#55c98c"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#e06c75"/>
    </marker>
    <style>
      .bg{fill:#0d0f10}.card{fill:#171a1c;stroke:#34393c;stroke-width:2}.focus{fill:#16211d;stroke:#55c98c;stroke-width:2.4}.decision{fill:#211f18;stroke:#d8ad45;stroke-width:2.4}.blocked{fill:#24191c;stroke:#e06c75;stroke-width:2}.title{font:700 34px Arial,sans-serif;fill:#f3f5f6}.subtitle{font:400 15px Arial,sans-serif;fill:#939ba1}.stage{font:700 12px Arial,sans-serif;letter-spacing:2px;fill:#687177}.name{font:700 16px Arial,sans-serif;fill:#f3f5f6}.text{font:400 12px Arial,sans-serif;fill:#aeb5ba}.mono{font:500 11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#7f8a91}.label{font:700 11px Arial,sans-serif;fill:#d8ad45}.labelRed{font:700 11px Arial,sans-serif;fill:#e06c75}.edge{fill:none;stroke:#7f8a91;stroke-width:2;marker-end:url(#arrow)}.edgeGreen{fill:none;stroke:#55c98c;stroke-width:2.2;marker-end:url(#arrowGreen)}.edgeRed{fill:none;stroke:#e06c75;stroke-width:2;marker-end:url(#arrowRed)}
    </style>
  </defs>

  <rect class="bg" width="1600" height="980"/>
  <rect width="1600" height="980" fill="url(#grid)" opacity=".45"/>

  <text class="title" x="800" y="56" text-anchor="middle">Архитектура CFT Security Agent</text>
  <text class="subtitle" x="800" y="86" text-anchor="middle">От SAST finding до проверяемого результата и решения для CI/CD</text>

  <text class="stage" x="800" y="126" text-anchor="middle">TRUSTED INPUTS</text>

  <rect class="card" x="620" y="145" width="220" height="88" rx="14"/>
  <text class="name" x="730" y="178" text-anchor="middle">Архитектурный граф</text>
  <text class="text" x="730" y="204" text-anchor="middle">сервисы · активы · trust zones</text>

  <rect class="card" x="890" y="145" width="220" height="88" rx="14"/>
  <text class="name" x="1000" y="178" text-anchor="middle">Репозиторий и код</text>
  <text class="text" x="1000" y="204" text-anchor="middle">source · config · metadata</text>

  <rect class="card" x="1160" y="145" width="220" height="88" rx="14"/>
  <text class="name" x="1270" y="178" text-anchor="middle">Permission policy</text>
  <text class="text" x="1270" y="204" text-anchor="middle">scope · limits · allowlist</text>

  <text class="stage" x="530" y="278" text-anchor="middle">CI PIPELINE И CONTEXT SCORING</text>

  <rect class="card" x="70" y="310" width="190" height="110" rx="14"/>
  <text class="name" x="165" y="349" text-anchor="middle">Разработчик / PR</text>
  <text class="text" x="165" y="378" text-anchor="middle">push · merge request</text>

  <rect class="card" x="310" y="310" width="190" height="110" rx="14"/>
  <text class="name" x="405" y="349" text-anchor="middle">CI/CD pipeline</text>
  <text class="text" x="405" y="378" text-anchor="middle">запуск и итоговый Gate</text>

  <rect class="card" x="550" y="310" width="190" height="110" rx="14"/>
  <text class="name" x="645" y="349" text-anchor="middle">SAST</text>
  <text class="text" x="645" y="378" text-anchor="middle">Semgrep · normalization</text>

  <rect class="focus" x="790" y="300" width="220" height="130" rx="14"/>
  <text class="name" x="900" y="340" text-anchor="middle">Context Scoring</text>
  <text class="text" x="900" y="370" text-anchor="middle">CVSS 4.0</text>
  <text class="text" x="900" y="396" text-anchor="middle">Context Priority</text>

  <path class="edgeGreen" d="M260 365H310"/>
  <path class="edgeGreen" d="M500 365H550"/>
  <path class="edgeGreen" d="M740 365H790"/>
  <path class="edge" d="M730 233V270H770V365H790"/>

  <text class="stage" x="1140" y="486" text-anchor="middle">CONTROLLED VERIFICATION</text>

  <rect class="focus" x="790" y="520" width="220" height="110" rx="14"/>
  <text class="name" x="900" y="558" text-anchor="middle">Security Agent</text>
  <text class="text" x="900" y="587" text-anchor="middle">гипотеза · DynamicPlan</text>

  <polygon class="decision" points="1140,500 1250,585 1140,670 1030,585"/>
  <text class="name" x="1140" y="566" text-anchor="middle">Validator</text>
  <text class="text" x="1140" y="594" text-anchor="middle">scope · policy · limits</text>
  <text class="text" x="1140" y="620" text-anchor="middle">APPROVE / DENY</text>

  <rect class="focus" x="1300" y="530" width="220" height="110" rx="14"/>
  <text class="name" x="1410" y="568" text-anchor="middle">Executor</text>
  <text class="text" x="1410" y="597" text-anchor="middle">approved capability</text>
  <text class="text" x="1410" y="620" text-anchor="middle">Docker sandbox</text>

  <path class="edge" d="M900 430V520"/>
  <path class="edge" d="M1000 233V470H900V520"/>
  <path class="edge" d="M1270 233V460H1140V500"/>
  <path class="edgeGreen" d="M1010 575H1030"/>
  <path class="edgeGreen" d="M1250 585H1300"/>
  <text class="label" x="1275" y="570" text-anchor="middle">APPROVE</text>

  <rect class="blocked" x="1030" y="740" width="220" height="100" rx="14"/>
  <text class="name" x="1140" y="778" text-anchor="middle">Policy blocked</text>
  <text class="text" x="1140" y="808" text-anchor="middle">запрет и причина</text>

  <rect class="focus" x="1300" y="730" width="220" height="120" rx="14"/>
  <text class="name" x="1410" y="768" text-anchor="middle">Evidence</text>
  <text class="text" x="1410" y="798" text-anchor="middle">логи · факты · артефакты</text>
  <text class="text" x="1410" y="824" text-anchor="middle">capability verdict</text>

  <path class="edgeRed" d="M1140 670V740"/>
  <text class="labelRed" x="1154" y="710">DENY</text>
  <path class="edgeGreen" d="M1410 640V730"/>
  <path class="edge" d="M1300 790H1270V700H900V630"/>

  <text class="stage" x="720" y="698" text-anchor="middle">RESULT</text>

  <rect class="card" x="760" y="740" width="220" height="110" rx="14"/>
  <text class="name" x="870" y="778" text-anchor="middle">FinalReport</text>
  <text class="text" x="870" y="807" text-anchor="middle">status · risk · Evidence</text>

  <rect class="card" x="480" y="740" width="210" height="110" rx="14"/>
  <text class="name" x="585" y="778" text-anchor="middle">CI Gate</text>
  <text class="text" x="585" y="807" text-anchor="middle">PASS · WARN · FAIL</text>

  <path class="edge" d="M1300 815H980"/>
  <path class="edgeRed" d="M1030 790H980"/>
  <path class="edgeGreen" d="M760 795H690"/>
  <path class="edgeGreen" d="M585 740V690H405V420"/>

  <line x1="70" y1="905" x2="1520" y2="905" stroke="#2b3033"/>
  <text class="mono" x="800" y="936" text-anchor="middle">Agent думает · Validator разрешает · Executor выполняет · Evidence определяет результат</text>
</svg>
