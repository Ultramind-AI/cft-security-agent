
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900"
     role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Архитектура ИИ-пентест-агента</title>
  <desc id="arch-desc">
    Диаграмма повторяет архитектуру Miro v0.2: разработчик и CI/CD запускают SAST,
    находки обогащаются архитектурным контекстом и CVSS, агент предлагает проверку,
    валидатор разрешает или запрещает её, исполнитель запускает только разрешённые действия,
    результаты возвращаются агенту и попадают в финальный отчёт и решение CI/CD.
  </desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#416C87"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0284C7"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#B84A62"/>
    </marker>
    <style>
      .bg{fill:#F3F8FC}.grid{stroke:#D8E8F2;stroke-width:1;opacity:.42}
      .title{font:700 34px Arial,sans-serif;fill:#102A43}
      .sub{font:400 15px Arial,sans-serif;fill:#58758A}
      .stage{font:700 12px Arial,sans-serif;letter-spacing:1.7px;fill:#66869B}
      .n{fill:#FCFEFF;stroke:#9CCCE5;stroke-width:1.5}
      .n2{fill:#EAF7FF;stroke:#63BCE8;stroke-width:1.7}
      .focus{fill:#DDF3FF;stroke:#2EA9E6;stroke-width:2.5}
      .decision{fill:#E7F7FD;stroke:#54B5D8;stroke-width:2.1}
      .blocked{fill:#FCEFF2;stroke:#D98395;stroke-width:1.6}
      .name{font:700 15px Arial,sans-serif;fill:#15374C}
      .small{font:400 12px Arial,sans-serif;fill:#5C7788}
      .mono{font:400 10px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#678396}
      .edge{fill:none;stroke:#416C87;stroke-width:1.45;marker-end:url(#a)}
      .edgeB{fill:none;stroke:#0284C7;stroke-width:1.65;marker-end:url(#ab)}
      .edgeR{fill:none;stroke:#B84A62;stroke-width:1.45;marker-end:url(#ar)}
      .label{font:600 10px Arial,sans-serif;fill:#46697F}
      .labelR{font:600 10px Arial,sans-serif;fill:#9B4055}
      .rule{stroke:#C8DCE8;stroke-width:1}
    </style>
    <pattern id="g" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" class="grid"/>
    </pattern>
  </defs>

  <rect class="bg" width="1800" height="900"/>
  <rect width="1800" height="900" fill="url(#g)" opacity=".55"/>

  <text class="title" x="900" y="57" text-anchor="middle">Архитектура ИИ-пентест-агента</text>
  <text class="sub" x="900" y="86" text-anchor="middle">CI/CD-пайплайн • контекстная оценка SAST-находок • контролируемая агентная проверка</text>

  <text class="stage" x="145" y="265" text-anchor="middle">ВХОД</text>
  <text class="stage" x="725" y="130" text-anchor="middle">ЭТАП 1 • КОНТЕКСТНАЯ ОЦЕНКА</text>
  <text class="stage" x="1370" y="130" text-anchor="middle">ЭТАП 2 • АГЕНТНАЯ ПРОВЕРКА</text>
  <text class="stage" x="720" y="665" text-anchor="middle">ВЫХОД</text>

  <!-- supporting inputs -->
  <rect class="n" x="720" y="155" width="230" height="78" rx="12"/>
  <text class="name" x="835" y="187" text-anchor="middle">Архитектурный граф</text>
  <text class="small" x="835" y="211" text-anchor="middle">сервисы • активы • зоны доверия</text>

  <rect class="n" x="1010" y="155" width="230" height="78" rx="12"/>
  <text class="name" x="1125" y="187" text-anchor="middle">Репозиторий / код</text>
  <text class="small" x="1125" y="211" text-anchor="middle">код • конфиги • метаданные</text>

  <rect class="n" x="1320" y="155" width="230" height="78" rx="12"/>
  <text class="name" x="1435" y="187" text-anchor="middle">Политика разрешений</text>
  <text class="small" x="1435" y="211" text-anchor="middle">scope • ограничения • правила</text>

  <!-- main pipeline -->
  <rect class="n2" x="55" y="350" width="180" height="94" rx="12"/>
  <text class="name" x="145" y="383" text-anchor="middle">Разработчик / PR</text>
  <text class="small" x="145" y="409" text-anchor="middle">push • merge request</text>

  <rect class="n2" x="290" y="350" width="180" height="94" rx="12"/>
  <text class="name" x="380" y="383" text-anchor="middle">CI/CD-пайплайн</text>
  <text class="small" x="380" y="409" text-anchor="middle">запуск проверки</text>

  <rect class="n2" x="525" y="346" width="200" height="102" rx="12"/>
  <text class="name" x="625" y="380" text-anchor="middle">SAST-анализ</text>
  <text class="small" x="625" y="406" text-anchor="middle">Semgrep • CodeQL • etc.</text>

  <rect class="focus" x="780" y="330" width="230" height="134" rx="12"/>
  <text class="name" x="895" y="366" text-anchor="middle">Контекстная оценка</text>
  <text class="small" x="895" y="393" text-anchor="middle">обогащение находок</text>
  <text class="small" x="895" y="418" text-anchor="middle">CVSS + контекстный приоритет</text>

  <rect class="focus" x="1070" y="322" width="245" height="150" rx="12"/>
  <text class="name" x="1192" y="359" text-anchor="middle">Агент-пентестер</text>
  <text class="small" x="1192" y="388" text-anchor="middle">анализирует • планирует</text>
  <text class="small" x="1192" y="413" text-anchor="middle">предлагает проверку</text>

  <polygon class="decision" points="1435,318 1540,397 1435,476 1330,397"/>
  <text class="name" x="1435" y="377" text-anchor="middle">Валидатор</text>
  <text class="small" x="1435" y="402" text-anchor="middle">scope • policy</text>
  <text class="small" x="1435" y="427" text-anchor="middle">разрешить / запретить</text>

  <rect class="n2" x="1580" y="342" width="170" height="110" rx="12"/>
  <text class="name" x="1665" y="375" text-anchor="middle">Исполнитель</text>
  <text class="small" x="1665" y="401" text-anchor="middle">только разрешённые</text>
  <text class="small" x="1665" y="423" text-anchor="middle">проверки</text>

  <rect class="n2" x="1565" y="540" width="200" height="104" rx="12"/>
  <text class="name" x="1665" y="568" text-anchor="middle">Доказательства /</text>
  <text class="name" x="1665" y="589" text-anchor="middle">результаты</text>
  <text class="small" x="1665" y="616" text-anchor="middle">логи • наблюдения • артефакты</text>

  <rect class="blocked" x="1335" y="548" width="200" height="90" rx="12"/>
  <text class="name" x="1435" y="581" text-anchor="middle">Отклонено политикой</text>
  <text class="small" x="1435" y="609" text-anchor="middle">запрет + причина</text>

  <!-- output -->
  <rect class="n2" x="690" y="710" width="250" height="116" rx="12"/>
  <text class="name" x="815" y="744" text-anchor="middle">Финальный отчёт</text>
  <text class="small" x="815" y="771" text-anchor="middle">confirmed / rejected / inconclusive</text>
  <text class="small" x="815" y="797" text-anchor="middle">CVSS • контекстный риск • evidence</text>

  <rect class="n2" x="415" y="714" width="220" height="108" rx="12"/>
  <text class="name" x="525" y="748" text-anchor="middle">Решение для CI/CD</text>
  <text class="small" x="525" y="775" text-anchor="middle">pass • warn • fail</text>
  <text class="small" x="525" y="800" text-anchor="middle">обратная связь команде</text>

  <!-- exact logical connections from Miro -->
  <path class="edgeB" d="M235 397 H290"/>
  <text class="label" x="262" y="386" text-anchor="middle">push / PR</text>

  <path class="edgeB" d="M470 397 H525"/>
  <text class="label" x="498" y="386" text-anchor="middle">запуск SAST</text>

  <path class="edge" d="M725 397 H780"/>
  <text class="label" x="752" y="386" text-anchor="middle">находки</text>

  <path class="edge" d="M835 233 V330"/>
  <text class="label" x="848" y="278">архитектурный контекст</text>

  <path class="edge" d="M1010 397 H1070"/>
  <text class="label" x="1040" y="386" text-anchor="middle">ранжированные находки</text>

  <path class="edge" d="M1125 233 V275 H1192 V322"/>
  <text class="label" x="1160" y="264" text-anchor="middle">кодовая база</text>

  <path class="edge" d="M1435 233 V318"/>
  <text class="label" x="1448" y="272">правила проверки</text>

  <path class="edge" d="M1315 397 H1330"/>
  <text class="label" x="1322" y="385" text-anchor="middle">предлагаемая проверка</text>

  <path class="edgeB" d="M1540 397 H1580"/>
  <text class="label" x="1560" y="385" text-anchor="middle">APPROVE</text>

  <path class="edgeB" d="M1665 452 V540"/>
  <text class="label" x="1678" y="500">выполнение</text>

  <path class="edge" d="M1565 592 H1538 V505 H1192 V472"/>
  <text class="label" x="1370" y="495" text-anchor="middle">наблюдение → перепланирование</text>

  <path class="edgeR" d="M1435 476 V548"/>
  <text class="labelR" x="1448" y="515">DENY</text>

  <path class="edgeR" d="M1435 638 V675 H900 V710"/>
  <text class="labelR" x="1168" y="666" text-anchor="middle">блокировка</text>

  <path class="edgeB" d="M1565 616 H990 V760 H940"/>
  <text class="label" x="1240" y="606" text-anchor="middle">результаты</text>

  <path class="edgeB" d="M690 768 H635"/>
  <text class="label" x="662" y="757" text-anchor="middle">финальный статус</text>

  <path class="edgeB" d="M525 714 V670 H380 V444"/>
  <text class="label" x="452" y="660" text-anchor="middle">pass / warn / fail</text>

  <line class="rule" x1="55" y1="858" x2="1745" y2="858"/>
  <text class="mono" x="900" y="882" text-anchor="middle">
    Главное правило: агент не выполняет действия напрямую; исполнитель работает только после одобрения валидатора.
  </text>
</svg>
