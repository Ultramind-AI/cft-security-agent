<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930" role="img" aria-labelledby="title desc">
  <title id="title">Workflow агента</title>
  <desc id="desc">Ограниченный цикл от AgentState и анализа finding до Validator, Executor, Evidence и FinalReport</desc>

  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#202426" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#7f8a91"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#55c98c"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#e06c75"/>
    </marker>
    <style>
      .bg{fill:#0d0f10}.card{fill:#171a1c;stroke:#34393c;stroke-width:2}.focus{fill:#16211d;stroke:#55c98c;stroke-width:2.4}.decision{fill:#211f18;stroke:#d8ad45;stroke-width:2.4}.blocked{fill:#24191c;stroke:#e06c75;stroke-width:2}.title{font:700 34px Arial,sans-serif;fill:#f3f5f6}.subtitle{font:400 15px Arial,sans-serif;fill:#939ba1}.stage{font:700 12px Arial,sans-serif;letter-spacing:2px;fill:#687177}.name{font:700 16px Arial,sans-serif;fill:#f3f5f6}.text{font:400 12px Arial,sans-serif;fill:#aeb5ba}.mono{font:500 11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#7f8a91}.label{font:700 11px Arial,sans-serif;fill:#d8ad45}.labelRed{font:700 11px Arial,sans-serif;fill:#e06c75}.edge{fill:none;stroke:#7f8a91;stroke-width:2;marker-end:url(#arrow)}.edgeGreen{fill:none;stroke:#55c98c;stroke-width:2.2;marker-end:url(#arrowGreen)}.edgeRed{fill:none;stroke:#e06c75;stroke-width:2;marker-end:url(#arrowRed)}
    </style>
  </defs>

  <rect class="bg" width="1600" height="930"/>
  <rect width="1600" height="930" fill="url(#grid)" opacity=".45"/>

  <text class="title" x="800" y="56" text-anchor="middle">Workflow агента</text>
  <text class="subtitle" x="800" y="86" text-anchor="middle">Observe · reason · validate · execute · collect Evidence · decide</text>

  <text class="stage" x="800" y="120" text-anchor="middle">TRUSTED TOOLS</text>

  <rect class="card" x="300" y="140" width="190" height="82" rx="14"/>
  <text class="name" x="395" y="172" text-anchor="middle">Read tools</text>
  <text class="text" x="395" y="197" text-anchor="middle">repo · SAST · architecture</text>

  <rect class="card" x="550" y="140" width="190" height="82" rx="14"/>
  <text class="name" x="645" y="172" text-anchor="middle">Scoring tools</text>
  <text class="text" x="645" y="197" text-anchor="middle">CVSS · Context Priority</text>

  <rect class="card" x="1290" y="140" width="220" height="82" rx="14"/>
  <text class="name" x="1400" y="172" text-anchor="middle">Execution tools</text>
  <text class="text" x="1400" y="197" text-anchor="middle">только approved capabilities</text>

  <text class="stage" x="790" y="258" text-anchor="middle">REASONING И VALIDATION</text>

  <rect class="card" x="60" y="285" width="190" height="120" rx="14"/>
  <text class="name" x="155" y="323" text-anchor="middle">AgentState</text>
  <text class="text" x="155" y="352" text-anchor="middle">finding · context · history</text>
  <text class="text" x="155" y="378" text-anchor="middle">Evidence · limits</text>

  <rect class="card" x="300" y="285" width="190" height="120" rx="14"/>
  <text class="name" x="395" y="323" text-anchor="middle">1. Контекст</text>
  <text class="text" x="395" y="352" text-anchor="middle">код и архитектура</text>

  <rect class="card" x="540" y="285" width="200" height="120" rx="14"/>
  <text class="name" x="640" y="323" text-anchor="middle">2. Анализ</text>
  <text class="text" x="640" y="352" text-anchor="middle">риск и приоритет</text>

  <rect class="card" x="790" y="285" width="210" height="120" rx="14"/>
  <text class="name" x="895" y="323" text-anchor="middle">3. Гипотеза</text>
  <text class="text" x="895" y="352" text-anchor="middle">что нужно подтвердить</text>

  <rect class="focus" x="1050" y="275" width="210" height="140" rx="14"/>
  <text class="name" x="1155" y="316" text-anchor="middle">4. DynamicPlan</text>
  <text class="text" x="1155" y="347" text-anchor="middle">ActionProposal</text>
  <text class="text" x="1155" y="373" text-anchor="middle">ожидаемый Evidence</text>

  <polygon class="decision" points="1400,260 1510,345 1400,430 1290,345"/>
  <text class="name" x="1400" y="327" text-anchor="middle">5. Validator</text>
  <text class="text" x="1400" y="356" text-anchor="middle">scope · policy · limits</text>
  <text class="text" x="1400" y="382" text-anchor="middle">APPROVE / DENY</text>

  <path class="edgeGreen" d="M250 345H300"/>
  <path class="edgeGreen" d="M490 345H540"/>
  <path class="edgeGreen" d="M740 345H790"/>
  <path class="edgeGreen" d="M1000 345H1050"/>
  <path class="edgeGreen" d="M1260 345H1290"/>
  <path class="edge" d="M395 222V285"/>
  <path class="edge" d="M645 222V285"/>

  <text class="stage" x="950" y="505" text-anchor="middle">EXECUTION И EVIDENCE</text>

  <rect class="focus" x="1290" y="540" width="220" height="120" rx="14"/>
  <text class="name" x="1400" y="579" text-anchor="middle">6. Executor</text>
  <text class="text" x="1400" y="608" text-anchor="middle">Docker sandbox</text>
  <text class="text" x="1400" y="634" text-anchor="middle">approved action</text>

  <rect class="focus" x="1020" y="540" width="220" height="120" rx="14"/>
  <text class="name" x="1130" y="579" text-anchor="middle">7. Evidence</text>
  <text class="text" x="1130" y="608" text-anchor="middle">наблюдения и артефакты</text>

  <rect class="card" x="750" y="540" width="220" height="120" rx="14"/>
  <text class="name" x="860" y="579" text-anchor="middle">8. Переоценка</text>
  <text class="text" x="860" y="608" text-anchor="middle">новый статус finding</text>

  <polygon class="decision" points="570,500 680,585 570,670 460,585"/>
  <text class="name" x="570" y="558" text-anchor="middle">9. Стоп?</text>
  <text class="text" x="570" y="587" text-anchor="middle">Evidence достаточно?</text>
  <text class="text" x="570" y="613" text-anchor="middle">лимит исчерпан?</text>

  <rect class="card" x="190" y="530" width="220" height="130" rx="14"/>
  <text class="name" x="300" y="571" text-anchor="middle">FinalReport</text>
  <text class="text" x="300" y="602" text-anchor="middle">confirmed · rejected</text>
  <text class="text" x="300" y="628" text-anchor="middle">inconclusive · blocked</text>

  <path class="edge" d="M1400 222V260"/>
  <path class="edgeGreen" d="M1400 430V540"/>
  <text class="label" x="1414" y="488">APPROVE</text>
  <path class="edgeGreen" d="M1290 600H1240"/>
  <path class="edgeGreen" d="M1020 600H970"/>
  <path class="edgeGreen" d="M750 585H680"/>
  <path class="edgeGreen" d="M460 585H410"/>
  <text class="label" x="435" y="572" text-anchor="middle">FINISH</text>

  <path class="edge" d="M570 500V465H895V405"/>
  <text class="mono" x="725" y="452" text-anchor="middle">CONTINUE: новая гипотеза с накопленным Evidence</text>

  <rect class="blocked" x="1290" y="735" width="220" height="100" rx="14"/>
  <text class="name" x="1400" y="773" text-anchor="middle">Policy blocked</text>
  <text class="text" x="1400" y="803" text-anchor="middle">запрет и причина</text>

  <path class="edgeRed" d="M1510 345H1550V785H1510"/>
  <text class="labelRed" x="1535" y="563" transform="rotate(90 1535 563)">DENY</text>
  <path class="edgeRed" d="M1290 785H300V660"/>

  <line x1="60" y1="875" x2="1510" y2="875" stroke="#2b3033"/>
  <text class="mono" x="785" y="906" text-anchor="middle">Терминальный Evidence важнее интерпретации LLM · каждый action проходит Validator</text>
</svg>
