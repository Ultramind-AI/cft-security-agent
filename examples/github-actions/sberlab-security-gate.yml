name: CFT Security Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          path: target

      - name: Checkout CFT security agent
        uses: actions/checkout@v4
        with:
          repository: Ultramind-AI/cft-security-agent
          path: agent
          token: ${{ secrets.CFT_AGENT_REPO_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: agent/pyproject.toml

      - name: Install agent and SAST dependencies
        working-directory: agent
        run: python -m pip install -e ".[sast]"

      - name: Run CFT security pipeline
        working-directory: agent
        env:
          CFT_AGENT_MODE: llm
          CFT_LLM_TRACE: "true"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python -m app.pipeline_run \
            --target ../target \
            --architecture targets/sberlab_architecture.yaml \
            --output-dir artifacts/security-pipeline \
            --max-iterations 1

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cft-security-results
          path: agent/artifacts/security-pipeline
          if-no-files-found: warn
