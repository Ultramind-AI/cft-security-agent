version: 1

targets:
  allowed:
    - sberlab-local

environments:
  allowed:
    - local
    - sandbox
    - staging

limits:
  max_iterations: 5
  executor:
    wall_time_seconds: 5
    cpu_time_seconds: 2
    memory_mb: 256
    max_file_bytes: 1048576
    max_processes: 8
    max_output_bytes: 16384
    max_runs_per_action: 1
    max_concurrent_runs: 1

tools:
  allowed:
    - safe_noop
    - check_sberlab_health
    - get_sberlab_public_projects
    - check_sberlab_backend_dockerfile_user

  parameter_contracts:
    safe_noop:
      allowed_keys:
        - message
        - test_outcome
      required_keys: []
      enum_values:
        test_outcome:
          - confirmed
          - rejected
          - inconclusive
      max_string_lengths:
        message: 256

    check_sberlab_health:
      allowed_keys: []
      required_keys: []

    get_sberlab_public_projects:
      allowed_keys: []
      required_keys: []

    check_sberlab_backend_dockerfile_user:
      allowed_keys: []
      required_keys: []

logging:
  required: true
