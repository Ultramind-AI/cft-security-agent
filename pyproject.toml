[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cft-security-agent"
version = "0.4.0"
description = "Contract-first starter architecture for a safe CI/CD security analysis agent."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "PyYAML>=6.0,<7",
  "langgraph>=0.2,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
cft-security-pipeline = "app.pipeline_run:main"
cft-security-ci = "app.ci_pipeline:main"
cft-security-api = "api.app:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "httpx>=0.27,<1",
]
sast = [
  "semgrep>=1,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "integration: requires local Docker and/or the trusted SberLab checkout",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "api*",
    "app*",
    "pipeline*",
    "agent*",
    "architecture*",
    "discovery*",
    "evidence*",
    "executor*",
    "evaluation*",
    "fix_verification*",
    "sast*",
    "schemas*",
    "scoring*",
    "reporting*",
    "security*",
    "tools*",
    "validator*",
]
exclude = [
    "tests*",
    "docs*",
    "targets*",
    "policies*",
]
