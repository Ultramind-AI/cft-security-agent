id: sberlab-local
name: SberLab Target v2

repository_path: ../sberlab-target
environment: local

architecture:
  file: targets/sberlab_architecture.yaml

sast:
  adapter: semgrep

runtime:
  type: docker_compose
  base_url: http://127.0.0.1:8000
  allowed_local_addresses:
    - 127.0.0.1:8000
  compose_file: docker-compose.yml

services:
  backend:
    type: django
    root: backend
    dependency_files:
      - backend/requirements.txt
    dockerfile: backend/Dockerfile
    healthcheck:
      path: /health/
    allowed_local_addresses:
      - 127.0.0.1:8000
    internal_port: 8000
    runtime_endpoints:
      - /health/
      - /api/projects/
    request_host: 127.0.0.1:8000

  frontend:
    type: react
    root: frontend/frontend
    dependency_files:
      - frontend/frontend/package.json
    dockerfile: frontend/frontend/Dockerfile
    internal_port: 80
    runtime_endpoints:
      - /

constraints:
  external_network: false
  host_filesystem: false
  docker_socket: false
  ci_secrets: false

metadata:
  ci.repository: Ultramind-AI/sberlab_hack
  react_html_flow.field: about

# Работаем только с зарегистрированными артефактами таргета
artifacts:
  backend_dockerfile:
    kind: dockerfile
    path: backend/Dockerfile
  frontend_dockerfile:
    kind: dockerfile
    path: frontend/frontend/Dockerfile
  demo_seed:
    kind: python
    path: backend/core/management/commands/seed_demo.py
  user_model:
    kind: python
    path: backend/core/models.py
    roles:
      - react_html_flow.model
  user_serializer:
    kind: python
    path: backend/core/serializers.py
    roles:
      - react_html_flow.serializer
  user_views:
    kind: python
    path: backend/core/views.py
    roles:
      - react_html_flow.view
  frontend_app:
    kind: javascript
    path: frontend/frontend/src/App.jsx
    roles:
      - react_html_flow.frontend
